<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LocalizaItem</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TELA INICIAL
    ========================== -->

    <section id="telaInicio" class="tela">

        <header class="header">

            <div class="logo">
                <span>📦</span>

                <div>
                    <h1>LocalizaItem</h1>
                    <p>Organize seus produtos</p>
                </div>
            </div>

            <button
                type="button"
                class="btn-novo"
                onclick="abrirCadastro()"
            >
                + Novo produto
            </button>

        </header>


        <main class="conteudo">

            <div class="inicio-topo">

                <div>
                    <h2>Meus produtos</h2>

                    <p id="contador">
                        0 produtos cadastrados
                    </p>
                </div>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="🔎 Pesquisar produto..."
                >

            </div>


            <div
                id="listaProdutos"
                class="lista-produtos"
            ></div>


            <div
                id="semProdutos"
                class="sem-produtos"
            >

                <div class="icone-grande">
                    📦
                </div>

                <h2>Nenhum produto</h2>

                <p>
                    Comece adicionando seu primeiro produto.
                </p>

                <button
                    type="button"
                    class="btn-novo grande"
                    onclick="abrirCadastro()"
                >
                    + Adicionar produto
                </button>

            </div>

        </main>

    </section>


    <!-- =========================
         TELA CADASTRO
    ========================== -->

    <section
        id="telaCadastro"
        class="tela escondida"
    >

        <header class="header">

            <button
                type="button"
                class="btn-voltar"
                onclick="voltarInicio()"
            >
                ← Voltar
            </button>

            <div class="logo">
                <span>📦</span>

                <h1>Novo produto</h1>
            </div>

        </header>


        <main class="conteudo centralizado">

            <div class="formulario">

                <div class="titulo-form">

                    <h2>Adicionar produto</h2>

                    <p>
                        Informe os dados e a localização do produto.
                    </p>

                </div>


                <form id="formProduto">

                    <label for="nome">
                        Nome do produto
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Teclado Logitech"
                        required
                    >


                    <label for="categoria">
                        Categoria
                    </label>

                    <input
                        type="text"
                        id="categoria"
                        placeholder="Ex: Eletrônicos"
                        required
                    >


                    <label for="localizacao">
                        Localização
                    </label>

                    <input
                        type="text"
                        id="localizacao"
                        placeholder="Ex: Estante 2"
                        required
                    >


                    <label for="descricao">
                        Descrição da posição
                    </label>

                    <textarea
                        id="descricao"
                        rows="5"
                        placeholder="Ex: Segunda prateleira, dentro da caixa preta, lado direito."
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="btn-salvar"
                    >
                        💾 Salvar produto
                    </button>

                </form>

            </div>

        </main>

    </section>


    <!-- =========================
         TELA VISUALIZAR PRODUTO
    ========================== -->

    <section
        id="telaProduto"
        class="tela escondida"
    >

        <header class="header">

            <button
                type="button"
                class="btn-voltar"
                onclick="voltarInicio()"
            >
                ← Voltar
            </button>

            <div class="logo">
                <span>📦</span>

                <h1>Produto</h1>
            </div>

        </header>


        <main class="conteudo centralizado">

            <div
                id="produtoDetalhes"
                class="produto-detalhes"
            ></div>

        </main>

    </section>


    <!-- =========================
         MODAL EDITAR
    ========================== -->

    <div
        id="modalEditar"
        class="modal escondido"
    >

        <div class="modal-caixa">

            <button
                type="button"
                class="fechar"
                onclick="fecharEdicao()"
            >
                ×
            </button>

            <h2>✏️ Editar produto</h2>


            <form id="formEditar">

                <input
                    type="hidden"
                    id="editarId"
                >


                <label for="editarCodigo">
                    Código do produto
                </label>

                <input
                    type="text"
                    id="editarCodigo"
                    placeholder="Ex: LZI-0001"
                    required
                >


                <label for="editarNome">
                    Nome
                </label>

                <input
                    type="text"
                    id="editarNome"
                    required
                >


                <label for="editarCategoria">
                    Categoria
                </label>

                <input
                    type="text"
                    id="editarCategoria"
                    required
                >


                <label for="editarLocalizacao">
                    Localização
                </label>

                <input
                    type="text"
                    id="editarLocalizacao"
                    required
                >


                <label for="editarDescricao">
                    Descrição
                </label>

                <textarea
                    id="editarDescricao"
                    rows="5"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="btn-salvar"
                >
                    💾 Salvar alterações
                </button>

            </form>

        </div>

    </div>


    <!-- =========================
         NOTIFICAÇÃO
    ========================== -->

    <div
        id="notificacao"
        class="notificacao"
    ></div>


    <script src="script.js"></script>

</body>

</html>
