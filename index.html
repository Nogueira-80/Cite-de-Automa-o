<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Localiza-Item</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="telaInicio" class="tela">
  <header class="header">
    <div class="logo"><span>🔎</span><div><h1>LocalizaItem</h1><p>Organize seus produtos</p></div></div>
    <button class="btn-novo" onclick="abrirCadastro()">+ Novo produto</button>
  </header>
  <main class="conteudo">
    <div class="inicio-topo">
      <div><h2>Meus produtos</h2><p id="contador">0 produtos cadastrados</p></div>
      <input type="text" id="pesquisa" placeholder="🔎 Pesquisar por nome, código, categoria...">
    </div>
    <div id="listaProdutos" class="lista-produtos"></div>
    <div id="semProdutos" class="sem-produtos">
      <div class="icone-grande">📦</div>
      <h2>Nenhum produto</h2>
      <p>Comece adicionando seu primeiro produto.</p>
      <button class="btn-novo grande" onclick="abrirCadastro()">+ Adicionar produto</button>
    </div>
  </main>
</section>

<section id="telaCadastro" class="tela escondida">
  <header class="header">
    <button class="btn-voltar" onclick="voltarInicio()">← Voltar</button>
    <div class="logo"><span>📦</span><h1>Novo produto</h1></div>
  </header>
  <main class="conteudo centralizado">
    <div class="formulario">
      <div class="titulo-form"><h2>Adicionar produto</h2><p>Informe os dados, o código e o estoque do produto.</p></div>
      <form id="formProduto">
        <label>Nome do produto</label>
        <input type="text" id="nome" placeholder="Ex: Teclado Logitech" required>
        <div class="linha-dupla">
          <div>
            <label>Categoria</label>
            <input type="text" id="categoria" placeholder="Ex: Eletrônicos" required>
          </div>
          <div>
            <label>Código do produto</label>
            <input type="text" id="codigo" placeholder="Ex: TEC-001" required>
          </div>
        </div>
        <label>Quantidade em estoque</label>
        <input type="number" id="quantidade" min="0" step="1" placeholder="Ex: 10" required>
        <label>Localização</label>
        <input type="text" id="localizacao" placeholder="Ex: Estante 2" required>
        <label>Descrição da posição</label>
        <textarea id="descricao" rows="5" placeholder="Ex: Segunda prateleira, dentro da caixa preta, lado direito." required></textarea>
        <button type="submit" class="btn-salvar">💾 Salvar produto</button>
      </form>
    </div>
  </main>
</section>

<section id="telaProduto" class="tela escondida">
  <header class="header">
    <button class="btn-voltar" onclick="voltarInicio()">← Voltar</button>
    <div class="logo"><span>📦</span><h1>Produto</h1></div>
  </header>
  <main class="conteudo centralizado">
    <div id="produtoDetalhes" class="produto-detalhes"></div>
  </main>
</section>

<div id="modalEditar" class="modal escondido">
  <div class="modal-caixa">
    <button class="fechar" onclick="fecharEdicao()">×</button>
    <h2>✏️ Editar produto</h2>
    <form id="formEditar">
      <input type="hidden" id="editarId">
      <label>Nome</label>
      <input type="text" id="editarNome" required>
      <div class="linha-dupla">
        <div><label>Categoria</label><input type="text" id="editarCategoria" required></div>
        <div><label>Código</label><input type="text" id="editarCodigo" required></div>
      </div>
      <label>Quantidade em estoque</label>
      <input type="number" id="editarQuantidade" min="0" step="1" required>
      <label>Localização</label>
      <input type="text" id="editarLocalizacao" required>
      <label>Descrição</label>
      <textarea id="editarDescricao" rows="5" required></textarea>
      <button type="submit" class="btn-salvar">💾 Salvar alterações</button>
    </form>
  </div>
</div>

<div id="modalRetirar" class="modal escondido">
  <div class="modal-caixa">
    <button class="fechar" onclick="fecharRetirada()">×</button>
    <h2>📤 Retirar do estoque</h2>
    <form id="formRetirar">
      <label id="labelEstoqueAtual"></label>
      <input type="number" id="qtdRetirar" min="1" step="1" required>
      <button type="submit" class="btn-salvar">Confirmar retirada</button>
    </form>
  </div>
</div>

<div id="notificacao" class="notificacao"></div>

<script src="script.js"></script>
</body>
</html>
